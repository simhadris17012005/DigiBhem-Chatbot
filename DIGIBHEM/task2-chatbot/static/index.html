<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DigiBhemBot - AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      background: #212121;
      color: #ececec;

      height: 100vh;
      overflow: hidden;
    }

    /* Main application */

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */

    .header {
      height: 60px;

      display: flex;
      align-items: center;

      padding: 0 24px;

      border-bottom: 1px solid #3a3a3a;

      background: #212121;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 18px;
      font-weight: 600;
    }

    .logo-icon {
      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      background: linear-gradient(135deg,
          #7c3aed,
          #2563eb);

      font-size: 18px;
    }

    .status {
      margin-left: 12px;

      font-size: 12px;
      color: #8e8e8e;
    }

    /* Chat area */

    #messages {
      flex: 1;

      overflow-y: auto;

      padding: 30px 20px 140px;
    }

    .message {
      width: 100%;
      max-width: 850px;

      margin: 0 auto 24px;

      display: flex;
      gap: 14px;
    }

    .avatar {
      width: 34px;
      height: 34px;

      min-width: 34px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 15px;
      font-weight: 600;
    }

    .user-avatar {
      background: #444;
    }

    .bot-avatar {
      background: linear-gradient(135deg,
          #7c3aed,
          #2563eb);
    }

    .message-content {
      flex: 1;

      line-height: 1.7;

      font-size: 15px;

      white-space: pre-wrap;

      word-wrap: break-word;
    }

    /* Welcome */

    .welcome {
      height: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .welcome-icon {
      width: 70px;
      height: 70px;

      border-radius: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(135deg,
          #7c3aed,
          #2563eb);

      font-size: 32px;

      margin-bottom: 20px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #9b9b9b;
      font-size: 15px;
    }

    /* Input */

    .input-area {
      position: fixed;

      bottom: 0;
      left: 0;
      right: 0;

      padding: 20px;

      background: linear-gradient(transparent,
          #212121 30%);
    }

    .input-box {
      max-width: 850px;

      margin: auto;

      display: flex;
      align-items: flex-end;

      background: #2f2f2f;

      border: 1px solid #4a4a4a;

      border-radius: 16px;

      padding: 10px 10px 10px 16px;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.25);
    }

    #input {
      flex: 1;

      border: none;
      outline: none;

      resize: none;

      background: transparent;

      color: #fff;

      font-family: inherit;
      font-size: 15px;

      line-height: 1.5;

      max-height: 150px;
    }

    #input::placeholder {
      color: #8e8e8e;
    }

    #send {
      width: 40px;
      height: 40px;

      border: none;
      border-radius: 10px;

      background: #7c3aed;

      color: white;

      cursor: pointer;

      font-size: 18px;

      transition: 0.2s;
    }

    #send:hover {
      background: #6d28d9;
    }

    #send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Typing animation */

    .typing {
      display: flex;
      gap: 5px;

      padding: 8px 0;
    }

    .dot {
      width: 7px;
      height: 7px;

      background: #aaa;

      border-radius: 50%;

      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-6px);
      }
    }

    /* Mobile */

    @media (max-width: 600px) {

      .header {
        padding: 0 15px;
      }

      #messages {
        padding-left: 15px;
        padding-right: 15px;
      }

      .message {
        gap: 10px;
      }

      .welcome h1 {
        font-size: 24px;
      }

      .input-area {
        padding: 10px;
      }

    }
  </style>

</head>


<body>

  <div class="app">

    <!-- Header -->

    <header class="header">

      <div class="logo">

        <div class="logo-icon">
          🤖
        </div>

        <span>DigiBhemBot</span>

      </div>

      <span class="status">
        AI Assistant
      </span>

    </header>


    <!-- Messages -->

    <main id="messages">

      <div class="welcome" id="welcome">

        <div class="welcome-icon">
          🤖
        </div>

        <h1>
          How can I help you?
        </h1>

        <p>
          Ask me anything about AI, coding, learning, or general topics.
        </p>

      </div>

    </main>


    <!-- Input -->

    <div class="input-area">

      <div class="input-box">

        <textarea id="input" rows="1" placeholder="Message DigiBhemBot..."></textarea>

        <button id="send">
          ↑
        </button>

      </div>

    </div>

  </div>


  <script>

    const messages = document.getElementById("messages");
    const input = document.getElementById("input");
    const sendButton = document.getElementById("send");
    const welcome = document.getElementById("welcome");


    let conversation = [];


    function addMessage(text, role) {

      if (welcome) {
        welcome.remove();
      }

      const message = document.createElement("div");

      message.className = "message";


      const avatar = document.createElement("div");

      avatar.className =
        "avatar " +
        (role === "user"
          ? "user-avatar"
          : "bot-avatar");


      avatar.textContent =
        role === "user"
          ? "U"
          : "🤖";


      const content = document.createElement("div");

      content.className = "message-content";

      content.textContent = text;


      message.appendChild(avatar);
      message.appendChild(content);

      messages.appendChild(message);


      messages.scrollTop =
        messages.scrollHeight;
    }


    function showTyping() {

      const message =
        document.createElement("div");

      message.className =
        "message";

      message.id =
        "typing-message";


      const avatar =
        document.createElement("div");

      avatar.className =
        "avatar bot-avatar";

      avatar.textContent =
        "🤖";


      const content =
        document.createElement("div");

      content.className =
        "message-content";


      content.innerHTML = `
            <div class="typing">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        `;


      message.appendChild(avatar);
      message.appendChild(content);

      messages.appendChild(message);

      messages.scrollTop =
        messages.scrollHeight;
    }


    function removeTyping() {

      const typing =
        document.getElementById(
          "typing-message"
        );

      if (typing) {
        typing.remove();
      }
    }


    async function sendMessage() {

      const text =
        input.value.trim();


      if (!text) {
        return;
      }


      addMessage(
        text,
        "user"
      );


      input.value = "";

      input.style.height =
        "auto";


      sendButton.disabled =
        true;


      showTyping();


      try {

        const response =
          await fetch(
            "/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                message: text,
                conversation:
                  conversation
              })
            }
          );


        if (!response.ok) {
          throw new Error(
            "Server error"
          );
        }


        const data =
          await response.json();


        removeTyping();


        addMessage(
          data.reply,
          "assistant"
        );


        conversation.push({
          role: "user",
          content: text
        });


        conversation.push({
          role: "assistant",
          content: data.reply
        });


      } catch (error) {

        removeTyping();

        addMessage(
          "Sorry, I couldn't connect to the AI server. Please try again.",
          "assistant"
        );

        console.error(error);

      } finally {

        sendButton.disabled =
          false;

        input.focus();

      }

    }


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    input.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    input.addEventListener(
      "input",
      function () {

        this.style.height =
          "auto";

        this.style.height =
          Math.min(
            this.scrollHeight,
            150
          ) + "px";

      }
    );


    input.focus();

  </script>


</body>

</html>
